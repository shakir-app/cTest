<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดทำบัตรข้อสอบ (Item Card System)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font: Sarabun -->
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- SheetJS (Excel Parser) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body { font-family: 'Sarabun', sans-serif; }
    
    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .page-break { page-break-after: always; }
      .no-print { display: none !important; }
    }

    .a4-page {
      width: 210mm;
      min-height: 297mm;
      padding: 8mm;
      margin: auto;
      background: white;
      box-sizing: border-box;
    }

    /* กรอบการ์ดข้อสอบสำหรับพิมพ์ */
    .card-container {
      font-size: 11px;
      line-height: 1.3;
      margin-bottom: 8mm;
      color: #000;
    }
    
    .card-header-box {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 4px;
    }

    .card-body-grid {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .card-left-col {
      width: 68%;
      border: 1px solid #000;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 130mm;
    }

    .card-right-col {
      width: 32%;
      border: 1px solid #000;
      padding: 8px 10px;
      min-height: 130mm;
    }

    .radio-icon {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 1px solid #000;
      border-radius: 50%;
      margin-right: 2px;
      vertical-align: middle;
      text-align: center;
      line-height: 8px;
      font-size: 8px;
    }
    .radio-icon.checked {
      background-color: #000;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between text-slate-800">

  <div>
    <!-- Navbar -->
    <nav class="bg-indigo-700 text-white shadow-lg no-print">
      <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <i class="fa-solid fa-file-signature text-2xl"></i>
          <span class="text-xl font-bold">ระบบจัดทำบัตรข้อสอบ</span>
        </div>
        <div id="userInfo" class="hidden flex items-center space-x-4">
          <span id="userName" class="font-medium bg-indigo-800 px-3 py-1 rounded-full text-sm"></span>
          <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-sm transition">
            <i class="fa-solid fa-right-from-bracket mr-1"></i> ออกจากระบบ
          </button>
        </div>
      </div>
    </nav>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto p-4 sm:p-6 no-print">
      
      <!-- Auth Section -->
      <div id="authSection" class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-8 my-10 border border-slate-200">
        <h2 class="text-2xl font-bold text-center text-indigo-700 mb-6" id="authTitle">เข้าสู่ระบบ</h2>
        <form id="authForm" onsubmit="handleAuth(event)">
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อผู้ใช้งาน</label>
            <input type="text" id="authUsername" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน</label>
            <input type="password" id="authPassword" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg font-semibold shadow-md transition">
            เข้าสู่ระบบ
          </button>
        </form>
        <div class="text-center mt-4">
          <button onclick="toggleAuthMode()" id="toggleAuthBtn" class="text-sm text-indigo-600 hover:underline">
            ยังไม่มีบัญชี? ลงทะเบียนที่นี่
          </button>
        </div>
      </div>

      <!-- Dashboard Section -->
      <div id="dashboardSection" class="hidden">
        <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
          <h1 class="text-2xl font-bold text-slate-800"><i class="fa-solid fa-book-bookmark text-indigo-600 mr-2"></i>แดชบอร์ดรายวิชา</h1>
          <button onclick="openSubjectModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl font-medium shadow-md transition flex items-center">
            <i class="fa-solid fa-plus mr-2"></i> เพิ่มรายวิชาใหม่
          </button>
        </div>
        <div id="subjectList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </div>

      <!-- Subject Detail Section -->
      <div id="subjectDetailSection" class="hidden">
        <div class="mb-6">
          <button onclick="showDashboard()" class="text-indigo-600 hover:text-indigo-800 mb-2 inline-flex items-center">
            <i class="fa-solid fa-arrow-left mr-2"></i> กลับหน้าแดชบอร์ด
          </button>
          <div class="bg-white rounded-2xl p-6 shadow-md border-l-8 border-indigo-600 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <h2 id="detailSubjectName" class="text-2xl font-bold"></h2>
              <p id="detailSubjectCode" class="text-slate-500 font-medium"></p>
            </div>
            <div class="flex flex-wrap gap-2">
              <button onclick="openQuestionModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg text-sm shadow transition">
                <i class="fa-solid fa-plus mr-1"></i> เพิ่มข้อสอบ
              </button>
              <button onclick="openExcelModal()" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-2 rounded-lg text-sm shadow transition">
                <i class="fa-solid fa-file-excel mr-1"></i> อัปโหลด Excel
              </button>
              <button onclick="printExamCards()" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded-lg text-sm shadow transition">
                <i class="fa-solid fa-print mr-1"></i> พิมพ์ชุดข้อสอบ
              </button>
            </div>
          </div>
        </div>

        <div id="questionList" class="space-y-4"></div>
      </div>

    </div>
  </div>

  <div id="print-area" class="hidden"></div>

  <!-- Footer -->
  <footer class="mt-12 py-6 bg-slate-800 text-slate-300 text-center text-sm no-print">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <p class="font-medium">created & designed by Shakir</p>
      </div>
      <button onclick="openDonateModal()" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center shadow-lg">
        <i class="fa-solid fa-mug-hot mr-2 text-base"></i> สนับสนุนค่ากาแฟ ☕
      </button>
    </div>
  </footer>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx9KLEC8MF_c0pgYoIZrI84jWOO5l6NnCXnfs0MQ6fk-uGuL9T4iwmevmp6DzJ8qG4/exec";

    let currentUser = null;
    let isRegisterMode = false;
    let currentSubjectId = null;
    let subjectsData = [];

    const REQUIRED_HEADERS = [
      'รูปแบบ', 'กลุ่มสาระ', 'ระดับชั้น', 'สาระ', 'มาตรฐาน', 
      'ตัวชี้วัด', 'ระดับพฤติกรรม', 'วัตถุประสงค์', 'โจทย์', 
      'ตัวเลือก1', 'ตัวเลือก2', 'ตัวเลือก3', 'ตัวเลือก4', 'เฉลย', 'เหตุผล'
    ];

    window.onload = function() {
      const savedUser = localStorage.getItem('itemcard_user');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        showDashboard();
      }
    };

    function openDonateModal() {
      const phone = "0952200855";
      const qrUrl = `https://promptpay.io/${phone}.png`;
      Swal.fire({
        title: '<strong>สนับสนุนค่ากาแฟ ☕</strong>',
        html: `
          <div class="text-center">
            <p class="text-xs text-slate-600 mb-3">สแกน QR Code ผ่านแอปธนาคารเพื่อสนับสนุนผู้พัฒนา</p>
            <img src="${qrUrl}" alt="PromptPay QR Code" class="mx-auto w-48 h-48 border rounded-lg shadow-md mb-3">
            <p class="font-bold text-sm text-slate-800">พร้อมเพย์: <span class="text-indigo-600">${phone}</span></p>
            <p class="text-xs text-slate-500 mt-1">ชื่อบัญชี: เอกวิทย์ สมาน</p>
          </div>
        `,
        showCloseButton: true,
        showConfirmButton: false
      });
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('authTitle').innerText = isRegisterMode ? 'ลงทะเบียนใหม่' : 'เข้าสู่ระบบ';
      document.getElementById('toggleAuthBtn').innerText = isRegisterMode ? 'มีบัญชีอยู่แล้ว? เข้าสู่ระบบ' : 'ยังไม่มีบัญชี? ลงทะเบียนที่นี่';
    }

    async function handleAuth(e) {
      e.preventDefault();
      const user = document.getElementById('authUsername').value;
      const pass = document.getElementById('authPassword').value;

      Swal.fire({ title: 'กำลังตรวจสอบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

      if (isRegisterMode) {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'registerUser', username: user, password: pass })
        });
        const result = await res.json();
        if (result.status === 'success') {
          Swal.fire('สำเร็จ', 'ลงทะเบียนเรียบร้อย เข้าสู่ระบบได้ทันที', 'success');
          toggleAuthMode();
        } else {
          Swal.fire('ข้อผิดพลาด', result.message, 'error');
        }
      } else {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'loginUser', username: user, password: pass })
        });
        const result = await res.json();
        if (result.status === 'success') {
          currentUser = { username: user };
          localStorage.setItem('itemcard_user', JSON.stringify(currentUser));
          showDashboard();
        } else {
          Swal.fire('ข้อผิดพลาด', result.message, 'error');
        }
      }
    }

    function logout() {
      localStorage.removeItem('itemcard_user');
      currentUser = null;
      document.getElementById('authSection').classList.remove('hidden');
      document.getElementById('dashboardSection').classList.add('hidden');
      document.getElementById('subjectDetailSection').classList.add('hidden');
      document.getElementById('userInfo').classList.add('hidden');
    }

    async function loadDataFromSheets() {
      Swal.fire({ title: 'กำลังโหลด...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getSubjects', username: currentUser.username })
        });
        const result = await res.json();
        if (result.status === 'success') {
          subjectsData = result.subjects;
          Swal.close();
        }
      } catch (err) {
        Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อได้', 'error');
      }
    }

    async function showDashboard() {
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('subjectDetailSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      document.getElementById('userInfo').classList.remove('hidden');
      document.getElementById('userName').innerText = currentUser.username;
      
      await loadDataFromSheets();
      renderSubjects();
    }

    function renderSubjects() {
      const listContainer = document.getElementById('subjectList');
      listContainer.innerHTML = '';

      if (subjectsData.length === 0) {
        listContainer.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400">ยังไม่มีรายวิชาที่สร้างขึ้น กด "เพิ่มรายวิชาใหม่" เพื่อเริ่มสร้าง</div>`;
        return;
      }

      subjectsData.forEach((s) => {
        const qCount = s.questions ? s.questions.length : 0;
        listContainer.innerHTML += `
          <div class="bg-white rounded-2xl shadow-md p-6 relative flex flex-col justify-between hover:shadow-lg transition">
            <div>
              <span class="text-xs font-semibold px-2.5 py-1 rounded bg-indigo-100 text-indigo-800">${s.code}</span>
              <h3 class="text-lg font-bold text-slate-800 mt-2">${s.name}</h3>
              <p class="text-sm text-slate-500 mt-1">หัวข้อ: ${s.topic || '-'}</p>
              <p class="text-sm text-slate-500">เป้าหมาย: ${s.maxQuestions || 0} ข้อ (สร้างแล้ว ${qCount} ข้อ)</p>
            </div>
            <div class="mt-6 flex justify-between items-center border-t pt-4">
              <button onclick="openSubjectDetail('${s.id}')" class="text-indigo-600 font-semibold hover:underline text-sm flex items-center">
                <i class="fa-solid fa-folder-open mr-1"></i> จัดการข้อสอบ
              </button>
              <div class="space-x-2">
                <button onclick="editSubject('${s.id}')" class="text-amber-500 hover:text-amber-700 p-1"><i class="fa-solid fa-pen"></i></button>
                <button onclick="deleteSubject('${s.id}')" class="text-red-500 hover:text-red-700 p-1"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
          </div>
        `;
      });
    }

    async function openSubjectModal(subject = null) {
      const { value: formValues } = await Swal.fire({
        title: subject ? 'แก้ไขรายวิชา' : 'เพิ่มรายวิชาใหม่',
        html: `
          <input id="swal-code" class="swal2-input" placeholder="รหัสวิชา" value="${subject ? subject.code : ''}">
          <input id="swal-name" class="swal2-input" placeholder="ชื่อรายวิชา" value="${subject ? subject.name : ''}">
          <input id="swal-topic" class="swal2-input" placeholder="หัวข้อ" value="${subject ? subject.topic : ''}">
          <input id="swal-max" type="number" class="swal2-input" placeholder="จำนวนข้อสอบ" value="${subject ? subject.maxQuestions : ''}">
        `,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: 'บันทึก',
        cancelButtonText: 'ยกเลิก',
        preConfirm: () => {
          return {
            id: subject ? subject.id : 'sub_' + Date.now(),
            code: document.getElementById('swal-code').value,
            name: document.getElementById('swal-name').value,
            topic: document.getElementById('swal-topic').value,
            maxQuestions: document.getElementById('swal-max').value
          }
        }
      });

      if (formValues) {
        if (!formValues.code || !formValues.name) {
          Swal.fire('ข้อผิดพลาด', 'กรุณากรอกรหัสวิชาและชื่อวิชา', 'error');
          return;
        }

        Swal.fire({ title: 'กำลังบันทึก...', didOpen: () => Swal.showLoading() });
        await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'saveSubject', username: currentUser.username, subject: formValues })
        });
        await loadDataFromSheets();
        renderSubjects();
        Swal.fire('สำเร็จ', 'บันทึกรายวิชาสำเร็จ', 'success');
      }
    }

    function editSubject(id) {
      const subject = subjectsData.find(s => s.id === id);
      if (subject) openSubjectModal(subject);
    }

    async function deleteSubject(id) {
      const result = await Swal.fire({
        title: 'ยืนยันการลบ?',
        text: "การลบรายวิชาจะทำให้ชุดข้อสอบทั้งหมดในวิชานี้ถูกลบออกด้วย",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: 'ใช่, ลบเลย',
        cancelButtonText: 'ยกเลิก'
      });

      if (result.isConfirmed) {
        Swal.fire({ title: 'กำลังลบ...', didOpen: () => Swal.showLoading() });
        await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'deleteSubject', subjectId: id })
        });
        await loadDataFromSheets();
        renderSubjects();
        Swal.fire('ลบเรียบร้อย', '', 'success');
      }
    }

    function openSubjectDetail(id) {
      currentSubjectId = id;
      const subject = subjectsData.find(s => s.id === id);

      document.getElementById('dashboardSection').classList.add('hidden');
      document.getElementById('subjectDetailSection').classList.remove('hidden');
      document.getElementById('detailSubjectName').innerText = subject.name;
      document.getElementById('detailSubjectCode').innerText = `รหัสวิชา: ${subject.code} | หัวข้อ: ${subject.topic || '-'}`;

      renderQuestions();
    }

    function renderQuestions() {
      const subject = subjectsData.find(s => s.id === currentSubjectId);
      const qContainer = document.getElementById('questionList');
      qContainer.innerHTML = '';

      if (!subject.questions || subject.questions.length === 0) {
        qContainer.innerHTML = `<div class="text-center py-10 bg-white rounded-xl shadow text-slate-400">ยังไม่มีข้อสอบในรายวิชานี้</div>`;
        return;
      }

      subject.questions.forEach((q, index) => {
        let choicesText = '-';
        if (q.type === 'เลือกตอบ') {
          choicesText = `1) ${q.choice1||'-'} 2) ${q.choice2||'-'} 3) ${q.choice3||'-'} 4) ${q.choice4||'-'}`;
        } else if (q.type === 'ถูกผิด') {
          choicesText = `1) ถูก  2) ผิด`;
        } else {
          const opts = [q.choice1, q.choice2, q.choice3, q.choice4].filter(c => c && c.trim() !== '');
          choicesText = opts.length > 0 ? opts.map((c, i) => `${i+1}) ${c}`).join('  ') : '-';
        }

        qContainer.innerHTML += `
          <div class="bg-white p-5 rounded-xl shadow flex justify-between items-start border-l-4 border-indigo-500">
            <div>
              <span class="font-bold text-indigo-700">ข้อที่ ${index + 1}</span>
              <span class="ml-2 text-xs bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded font-medium border border-indigo-200">แบบ${q.type || 'เลือกตอบ'}</span>
              <p class="mt-2 text-slate-800 font-medium">${q.question || '-'}</p>
              <div class="text-xs text-slate-500 mt-2 space-y-1">
                <p><strong>ตัวเลือก:</strong> ${choicesText}</p>
                <p><strong>เฉลย:</strong> ${q.answer || '-'} | <strong>ระดับพฤติกรรม:</strong> ${q.behavior || '-'}</p>
              </div>
            </div>
            <div class="flex space-x-2">
              <button onclick="openQuestionModal(${index})" class="text-amber-500 hover:text-amber-700 p-2"><i class="fa-solid fa-pen"></i></button>
              <button onclick="deleteQuestion('${q.id}')" class="text-red-500 hover:text-red-700 p-2"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;
      });
    }

    function handleTypeChange(qData = {}) {
      const type = document.getElementById('q-type').value;
      const choicesBox = document.getElementById('choices-container');
      
      if (type === 'เลือกตอบ') {
        choicesBox.innerHTML = `
          <div><label class="font-bold">ตัวเลือก 1</label><input id="q-c1" class="swal2-input !mt-1 !h-9 text-xs" value="${qData.choice1 || ''}"></div>
          <div><label class="font-bold">ตัวเลือก 2</label><input id="q-c2" class="swal2-input !mt-1 !h-9 text-xs" value="${qData.choice2 || ''}"></div>
          <div><label class="font-bold">ตัวเลือก 3</label><input id="q-c3" class="swal2-input !mt-1 !h-9 text-xs" value="${qData.choice3 || ''}"></div>
          <div><label class="font-bold">ตัวเลือก 4</label><input id="q-c4" class="swal2-input !mt-1 !h-9 text-xs" value="${qData.choice4 || ''}"></div>
        `;
      } else if (type === 'ถูกผิด') {
        choicesBox.innerHTML = `
          <div class="col-span-2 bg-slate-50 p-2.5 rounded border text-slate-600 font-medium text-xs">
            <strong>ตัวเลือกอัตโนมัติ:</strong> 1) ถูก &nbsp;&nbsp;&nbsp; 2) ผิด
          </div>
        `;
      } else {
        choicesBox.innerHTML = `
          <div class="col-span-2 space-y-2">
            <div class="flex justify-between items-center mb-1">
              <span class="text-slate-500 italic">เพิ่มตัวเลือก/คำตอบย่อย (สูงสุด 4 ช่อง)</span>
              <button type="button" onclick="addDynamicOption()" id="btnAddOption" class="bg-indigo-600 hover:bg-indigo-700 text-white px-2.5 py-1 rounded text-xs transition">
                <i class="fa-solid fa-plus mr-1"></i> เพิ่มตัวเลือก
              </button>
            </div>
            <div id="dynamic-inputs-list" class="space-y-2"></div>
          </div>
        `;

        const existingChoices = [qData.choice1, qData.choice2, qData.choice3, qData.choice4].filter(c => c && c.trim() !== '');
        if (existingChoices.length > 0) {
          existingChoices.forEach(val => addDynamicOption(val));
        } else {
          addDynamicOption();
        }
      }
    }

    function addDynamicOption(value = '') {
      const container = document.getElementById('dynamic-inputs-list');
      if (!container) return;

      const currentInputs = container.querySelectorAll('.dynamic-opt-input');
      if (currentInputs.length >= 4) {
        Swal.showValidationMessage('สามารถเพิ่มตัวเลือกได้สูงสุด 4 ช่องเท่านั้น');
        return;
      }

      const optId = `q-dyn-${Date.now()}-${Math.floor(Math.random() * 1000)}`;
      const div = document.createElement('div');
      div.className = 'flex items-center space-x-2 dynamic-opt-item';
      div.innerHTML = `
        <span class="text-xs font-bold text-slate-500 w-12">ช่องที่ ${container.children.length + 1}:</span>
        <input id="${optId}" class="swal2-input !mt-0 !h-9 text-xs flex-1 dynamic-opt-input" placeholder="ระบุตัวเลือก/ข้อความ" value="${value}">
        <button type="button" onclick="removeDynamicOption(this)" class="text-red-500 hover:text-red-700 p-1.5 text-xs">
          <i class="fa-solid fa-trash"></i>
        </button>
      `;
      container.appendChild(div);
      updateDynamicOptionLabels();
    }

    function removeDynamicOption(btn) {
      const item = btn.closest('.dynamic-opt-item');
      if (item) {
        item.remove();
        updateDynamicOptionLabels();
      }
    }

    function updateDynamicOptionLabels() {
      const container = document.getElementById('dynamic-inputs-list');
      if (!container) return;
      const items = container.querySelectorAll('.dynamic-opt-item');
      items.forEach((item, index) => {
        const label = item.querySelector('span');
        if (label) label.innerText = `ช่องที่ ${index + 1}:`;
      });

      const btnAdd = document.getElementById('btnAddOption');
      if (btnAdd) {
        btnAdd.disabled = items.length >= 4;
        if (items.length >= 4) {
          btnAdd.classList.add('opacity-50', 'cursor-not-allowed');
        } else {
          btnAdd.classList.remove('opacity-50', 'cursor-not-allowed');
        }
      }
    }

    // ฟังก์ชันอ่านไฟล์ ตรวจสอบ Header และบันทึก
    function processExcelFile(file) {
      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];

          const headers = XLSX.utils.sheet_to_json(worksheet, { header: 1 })[0] || [];
          const missingHeaders = REQUIRED_HEADERS.filter(h => !headers.includes(h));

          if (missingHeaders.length > 0) {
            Swal.fire({
              icon: 'error',
              title: 'รูปแบบไฟล์ไม่ถูกต้อง!',
              html: `
                <div class="text-left text-xs space-y-2">
                  <p class="text-red-600 font-bold">หัวแถว (Header) ในไฟล์ไม่ตรงกับแม่แบบที่กำหนด</p>
                  <p>คอลัมน์ที่ขาดหายไปหรือพิมพ์ผิด:</p>
                  <div class="bg-red-50 p-2 border border-red-200 rounded text-red-700 font-mono text-[11px]">
                    ${missingHeaders.join(', ')}
                  </div>
                  <p class="text-slate-500">กรุณาดาวน์โหลดไฟล์แม่แบบ (Template) แล้วกรอกข้อมูลใหม่อีกครั้ง</p>
                </div>
              `
            });
            return;
          }

          const rows = XLSX.utils.sheet_to_json(worksheet);
          
          if (rows.length === 0) {
            Swal.fire('แจ้งเตือน', 'ไม่พบข้อมูลข้อสอบในไฟล์ Excel', 'warning');
            return;
          }

          Swal.fire({ 
            title: 'กำลังนำ Load...', 
            text: `กำลังบันทึกข้อมูลทั้งหมด ${rows.length} ข้อ`,
            allowOutsideClick: false, 
            didOpen: () => Swal.showLoading() 
          });

          for (let i = 0; i < rows.length; i++) {
            const r = rows[i];
            const qObj = {
              id: 'q_' + Date.now() + '_' + i,
              number: i + 1,
              type: r['รูปแบบ'] || 'เลือกตอบ',
              group: r['กลุ่มสาระ'] || '',
              grade: r['ระดับชั้น'] || '',
              strand: r['สาระ'] || '',
              standard: r['มาตรฐาน'] || '',
              indicator: r['ตัวชี้วัด'] || '',
              behavior: r['ระดับพฤติกรรม'] || 'ความจำ',
              objective: r['วัตถุประสงค์'] || '',
              question: r['โจทย์'] || '',
              choice1: String(r['ตัวเลือก1'] || ''),
              choice2: String(r['ตัวเลือก2'] || ''),
              choice3: String(r['ตัวเลือก3'] || ''),
              choice4: String(r['ตัวเลือก4'] || ''),
              answer: String(r['เฉลย'] || ''),
              reason: String(r['เหตุผล'] || ''),
              wrongReason: String(r['คำอธิบายข้อที่ผิด'] || '')
            };

            await fetch(GAS_URL, {
              method: 'POST',
              body: JSON.stringify({ action: 'saveQuestion', username: currentUser.username, subjectId: currentSubjectId, question: qObj })
            });
          }

          await loadDataFromSheets();
          renderQuestions();
          Swal.fire('สำเร็จ', `นำเข้าข้อสอบจำนวน ${rows.length} ข้อ เรียบร้อยแล้ว`, 'success');

        } catch (err) {
          Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถอ่านไฟล์ Excel ได้: ' + err.message, 'error');
        }
      };

      reader.readAsArrayBuffer(file);
    }

    function printExamCards() {
      const subject = subjectsData.find(s => s.id === currentSubjectId);
      const questions = subject.questions || [];

      if (questions.length === 0) {
        Swal.fire('ข้อผิดพลาด', 'ไม่มีข้อมูลข้อสอบที่จะพิมพ์', 'warning');
        return;
      }

      const printArea = document.getElementById('print-area');
      printArea.innerHTML = '';

      for (let i = 0; i < questions.length; i += 2) {
        let pageHTML = `<div class="a4-page page-break">`;
        pageHTML += generateCardHTML(subject, questions[i], i + 1);

        if (i + 1 < questions.length) {
          pageHTML += generateCardHTML(subject, questions[i + 1], i + 2);
        }

        pageHTML += `</div>`;
        printArea.innerHTML += pageHTML;
      }

      printArea.classList.remove('hidden');
      window.print();
      printArea.classList.add('hidden');
    }

    function generateCardHTML(subject, q, num) {
  const qType = q.type || 'เลือกตอบ';
  
  const isMc = (qType === 'เลือกตอบ');
  const isTf = (qType === 'ถูกผิด');
  const isMatch = (qType === 'จับคู่');
  const isFill = (qType === 'เติมคำ');
  const isSubjective = (qType === 'อัตนัย');

  const behaviors = ['ความจำ', 'ความเข้าใจ', 'นำไปใช้', 'วิเคราะห์', 'ประเมินค่า', 'สร้างสรรค์'];
  const bCheck = {};
  behaviors.forEach(b => {
    bCheck[b] = (q.behavior === b);
  });

  let choicesHTML = '';
  if (isMc) {
    choicesHTML = `
      <div class="grid grid-cols-2 gap-x-2 gap-y-1 mt-1 pl-2">
        <div>1. ${q.choice1 || ''}</div>
        <div>2. ${q.choice2 || ''}</div>
        <div>3. ${q.choice3 || ''}</div>
        <div>4. ${q.choice4 || ''}</div>
      </div>
    `;
  } else if (isTf) {
    choicesHTML = `<div class="mt-1 pl-2">1) ถูก &nbsp;&nbsp;&nbsp;&nbsp; 2) ผิด</div>`;
  } else {
    const opts = [q.choice1, q.choice2, q.choice3, q.choice4].filter(c => c && c.trim() !== '');
    if (opts.length > 0) {
      choicesHTML = `<div class="mt-1 pl-2 space-y-0.5">` + opts.map((c, i) => `<div>${i + 1}) ${c}</div>`).join('') + `</div>`;
    } else {
      choicesHTML = `<div class="mt-1 pl-2 italic text-gray-500">(- รูปแบบ${qType} -)</div>`;
    }
  }

  return `
    <div class="card-container">
      <!-- Header: ชื่อบัตรข้อสอบ + กล่องเลขข้อขวาบน -->
      <div class="card-header-box">
        <div class="w-1/3"></div>
        <div class="w-1/3 text-center font-bold text-sm">บัตรข้อสอบ (Item Card)</div>
        <div class="w-1/3 flex justify-end">
          <div class="border border-black px-3 py-1 font-bold text-xs flex items-center gap-2 bg-white">
            <span>ข้อที่</span>
            <span class="text-sm font-semibold">${num}</span>
          </div>
        </div>
      </div>

      <!-- Main Body Grid Layout -->
      <div class="card-body-grid">
        
        <!-- ฝั่งซ้าย: ข้อมูลรายวิชา ตัวเลือก ลายเซ็น -->
        <div class="card-left-col">
          <div>
            <!-- ข้อ 1. รูปแบบข้อสอบ -->
            <div class="flex items-start gap-1">
              <span class="font-bold whitespace-nowrap">1.รูปแบบข้อสอบ</span>
              <div class="flex-1">
                <div class="mb-0.5">
                  1. <span class="radio-icon ${isMc ? 'checked' : ''}"></span> แบบเลือกตอบ (Multiple choices)
                </div>
                <div class="flex flex-wrap gap-x-2 gap-y-0.5">
                  <span>2. แบบอื่น ๆ</span>
                  <span><span class="radio-icon ${isTf ? 'checked' : ''}"></span> ถูกผิด</span>
                  <span><span class="radio-icon ${isMatch ? 'checked' : ''}"></span> จับคู่</span>
                  <span><span class="radio-icon ${isFill ? 'checked' : ''}"></span> เติมคำ</span>
                  <span><span class="radio-icon ${isSubjective ? 'checked' : ''}"></span> อัตนัย</span>
                </div>
              </div>
            </div>

            <!-- ข้อ 2-6. ข้อมูลวิชา -->
            <div class="grid grid-cols-12 gap-x-1 mt-1.5">
              <div class="col-span-6"><span class="font-bold">2.รายวิชา</span> ${subject.name || ''}</div>
              <div class="col-span-6"><span class="font-bold">รหัส</span> ${subject.code || ''}</div>
              
              <div class="col-span-12 mt-0.5"><span class="font-bold">กลุ่มสาระการเรียนรู้</span> ${q.group || ''}</div>
              
              <div class="col-span-12 mt-0.5"><span class="font-bold">3.ระดับชั้น</span> ${q.grade || ''}</div>
              <div class="col-span-12 mt-0.5"><span class="font-bold">4.สาระที่</span> ${q.strand || ''}</div>
              <div class="col-span-12 mt-0.5"><span class="font-bold">5.มาตรฐานการเรียนรู้ที่</span> ${q.standard || ''}</div>
              <div class="col-span-12 mt-0.5"><span class="font-bold">6.ตัวชี้วัดที่</span> ${q.indicator || ''}</div>
            </div>

            <!-- ข้อ 7. ระดับพฤติกรรม -->
            <div class="mt-1.5">
              <span class="font-bold">7.ระดับพฤติกรรมที่ต้องการวัด</span>
              <div class="grid grid-cols-3 gap-y-0.5 pl-4 mt-0.5">
                <div><span class="radio-icon ${bCheck['ความจำ'] ? 'checked' : ''}"></span> ความจำ</div>
                <div><span class="radio-icon ${bCheck['ความเข้าใจ'] ? 'checked' : ''}"></span> ความเข้าใจ</div>
                <div><span class="radio-icon ${bCheck['นำไปใช้'] ? 'checked' : ''}"></span> นำไปใช้</div>
                <div><span class="radio-icon ${bCheck['วิเคราะห์'] ? 'checked' : ''}"></span> วิเคราะห์</div>
                <div><span class="radio-icon ${bCheck['ประเมินค่า'] ? 'checked' : ''}"></span> ประเมินค่า</div>
                <div><span class="radio-icon ${bCheck['สร้างสรรค์'] ? 'checked' : ''}"></span> สร้างสรรค์</div>
              </div>
            </div>

            <!-- ข้อ 8. วัตถุประสงค์ -->
            <div class="mt-1.5">
              <span class="font-bold">8.วัตถุประสงค์เชิงพฤติกรรมของข้อสอบนี้</span>
              <div class="pl-2 mt-0.5">${q.objective || '-'}</div>
            </div>

            <!-- ข้อ 9. โจทย์ -->
            <div class="mt-2">
              <span class="font-bold">9.โจทย์/คำถาม</span>
              <div class="pl-2 mt-0.5 leading-normal font-medium">${q.question || ''}</div>
            </div>

            <!-- ข้อ 10. ตัวเลือก -->
            <div class="mt-2">
              <span class="font-bold">10.ตัวเลือก</span>
              ${choicesHTML}
            </div>
          </div>

          <!-- ลายเซ็นผู้ออก + ผู้กลั่นกรอง 2 ท่าน -->
          <div class="mt-4 pt-2 border-t border-dashed border-gray-300">
            <div class="flex justify-end mb-2">
              <div class="text-center w-52">
                <div>( ........................................................... )</div>
                <div class="font-bold text-[10px] mt-0.5">ผู้กลั่นกรองข้อสอบ</div>
              </div>
            </div>

            <div class="flex justify-between items-end">
              <div class="text-center">
                <span class="font-bold">ลงชื่อ</span> ........................................................... <span class="font-bold">ผู้ออกข้อสอบ</span>
                <div class="mt-0.5">( ${currentUser.username || ''} )</div>
              </div>
              <div class="text-center w-52">
                <div>( ........................................................... )</div>
                <div class="font-bold text-[10px] mt-0.5">ผู้กลั่นกรองข้อสอบ</div>
              </div>
            </div>
          </div>

        </div>

        <!-- ฝั่งขวา: เฉลย + เหตุผลข้อถูก + คำอธิบายข้อที่ผิด -->
        <div class="card-right-col flex flex-col justify-between">
          <div>
            <div class="text-center font-bold text-sm mb-3">เฉลย</div>
            
            <div class="font-bold mb-1">ตัวเลือกที่ถูกคือ</div>
            <div class="pl-2 mb-3 text-indigo-900 font-bold">${q.answer || '-'}</div>
            
            <div class="font-bold mb-1">เหตุผล (ทำไมข้อนี้ถึงถูก)</div>
            <div class="pl-2 mb-4 text-xs leading-relaxed">${q.reason || '-'}</div>
          </div>

          <div class="mt-auto pt-2 border-t border-gray-200">
            <div class="font-bold mb-1">คำอธิบายข้อที่ผิด</div>
            <div class="pl-2 text-xs leading-relaxed text-gray-700 min-h-[60px]">
              ${q.wrongReason || '-'}
            </div>
          </div>
        </div>

      </div>
    </div>
  `;
}
  </script>
</body>
</html>
