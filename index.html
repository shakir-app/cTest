<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดทำบัตรข้อสอบ (Item Card System)</title>
 
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font: Sarabun -->
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- SheetJS (Excel Parser) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body { font-family: 'Sarabun', sans-serif; }
   
    /* สไตล์สำหรับการพิมพ์กระดาษ A4 แนวตั้ง (หน้าละ 2 การ์ดข้อสอบ) */
    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .page-break { page-break-after: always; }
      .no-print { display: none !important; }
    }

    .a4-page {
      width: 210mm;
      min-height: 297mm;
      padding: 8mm 10mm;
      margin: auto;
      background: white;
      box-sizing: border-box;
    }

    /* โครงสร้างการ์ดข้อสอบตามแบบรูปอ้างอิง */
    .card-container {
      font-size: 11px;
      line-height: 1.35;
      margin-bottom: 6mm;
      color: #000;
      box-sizing: border-box;
    }

    .card-header-box {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 4px;
    }

    .card-main-grid {
      display: flex;
      border: 1px solid #000;
      width: 100%;
      min-height: 125mm;
    }

    .card-left-col {
      width: 68%;
      border-right: 1px solid #000;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-right-col {
      width: 32%;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
    }

    .radio-icon {
      display: inline-block;
      width: 9px;
      height: 9px;
      border: 1px solid #000;
      border-radius: 50%;
      margin-right: 2px;
      vertical-align: middle;
    }
    .radio-icon.checked {
      background-color: #000;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between text-slate-800">

  <div>
    <!-- Navbar -->
    <nav class="bg-indigo-700 text-white shadow-lg no-print">
      <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <i class="fa-solid fa-file-signature text-xl sm:text-2xl"></i>
          <span class="text-lg sm:text-xl font-bold">ระบบจัดทำบัตรข้อสอบ</span>
        </div>
        <div id="userInfo" class="hidden flex items-center space-x-2 sm:space-x-4">
          <span id="userName" class="font-medium bg-indigo-800 px-2.5 py-1 rounded-full text-xs sm:text-sm"></span>
          <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-2.5 py-1.5 rounded-lg text-xs sm:text-sm transition">
            <i class="fa-solid fa-right-from-bracket mr-1"></i> <span class="hidden sm:inline">ออกจากระบบ</span>
          </button>
        </div>
      </div>
    </nav>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto p-3 sm:p-6 no-print">
     
      <!-- Auth Section -->
      <div id="authSection" class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-6 sm:p-8 my-6 sm:my-10 border border-slate-200">
        
        <!-- Tab Switching Header -->
        <div class="flex border-b border-slate-200 mb-6">
          <button id="loginTabBtn" onclick="switchAuthTab('login')" class="flex-1 py-3 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 transition">
            <i class="fa-solid fa-right-to-bracket mr-2"></i>เข้าสู่ระบบ
          </button>
          <button id="registerTabBtn" onclick="switchAuthTab('register')" class="flex-1 py-3 text-center font-bold text-slate-400 border-b-2 border-transparent hover:text-indigo-600 transition">
            <i class="fa-solid fa-user-plus mr-2"></i>ลงทะเบียน
          </button>
        </div>

        <!-- Form 1: เข้าสู่ระบบ -->
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="mb-4">
            <label class="block text-sm font-semibold text-slate-700 mb-1">ชื่อผู้ใช้งาน (Username)</label>
            <input type="text" id="loginUsername" required placeholder="กรอกชื่อผู้ใช้งาน" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
          </div>
          <div class="mb-6">
            <label class="block text-sm font-semibold text-slate-700 mb-1">รหัสผ่าน</label>
            <input type="password" id="loginPassword" required placeholder="กรอกรหัสผ่าน" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
          </div>
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold shadow-md hover:shadow-lg transition flex items-center justify-center">
            <i class="fa-solid fa-right-to-bracket mr-2"></i> เข้าสู่ระบบ
          </button>
        </form>

        <!-- Form 2: ลงทะเบียน -->
        <form id="registerForm" onsubmit="handleRegister(event)" class="hidden">
          <div class="mb-4">
            <label class="block text-sm font-semibold text-slate-700 mb-1">ชื่อ-นามสกุล <span class="text-rose-500">*</span></label>
            <p class="text-[11px] text-slate-500 mb-1">จะใช้นำไประบุเป็น "ผู้ออกข้อสอบ" บนบัตรข้อสอบ</p>
            <input type="text" id="regFullname" required placeholder="เช่น นายเอกคณิต อนุรักษ์ฟิสิกส์" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
          </div>
          <div class="mb-4">
            <label class="block text-sm font-semibold text-slate-700 mb-1">ชื่อผู้ใช้งาน (Username) <span class="text-rose-500">*</span></label>
            <input type="text" id="regUsername" required placeholder="ภาษาอังกฤษหรือตัวเลขสำหรับเข้าระบบ" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
          </div>
          <div class="mb-6">
            <label class="block text-sm font-semibold text-slate-700 mb-1">รหัสผ่าน <span class="text-rose-500">*</span></label>
            <input type="password" id="regPassword" required placeholder="กำหนดรหัสผ่าน" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
          </div>
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold shadow-md hover:shadow-lg transition flex items-center justify-center">
            <i class="fa-solid fa-user-check mr-2"></i> ลงทะเบียนใช้งาน
          </button>
        </form>

      </div>

      <!-- Dashboard Section -->
      <div id="dashboardSection" class="hidden">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
          <h1 class="text-xl sm:text-2xl font-bold text-slate-800"><i class="fa-solid fa-book-bookmark text-indigo-600 mr-2"></i>แดชบอร์ดรายวิชา</h1>
          <button onclick="openSubjectModal()" class="w-full sm:w-auto justify-center bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl font-medium shadow-md transition flex items-center">
            <i class="fa-solid fa-plus mr-2"></i> เพิ่มรายวิชาใหม่
          </button>
        </div>
        <div id="subjectList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6"></div>
      </div>

      <!-- Subject Detail Section -->
      <div id="subjectDetailSection" class="hidden">
        <div class="mb-6">
          <button onclick="showDashboard()" class="text-indigo-600 hover:text-indigo-800 mb-3 inline-flex items-center text-sm font-semibold">
            <i class="fa-solid fa-arrow-left mr-2"></i> ย้อนกลับ
          </button>
          <div class="bg-white rounded-2xl p-4 sm:p-6 shadow-md border-l-8 border-indigo-600 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <h2 id="detailSubjectName" class="text-xl sm:text-2xl font-bold"></h2>
              <p id="detailSubjectCode" class="text-slate-500 font-medium text-xs sm:text-sm mt-1"></p>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 w-full md:w-auto">
              <button onclick="openQuestionModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg text-xs sm:text-sm shadow transition flex items-center justify-center">
                <i class="fa-solid fa-plus mr-1.5"></i> เพิ่มข้อสอบ
              </button>
              <button onclick="openExcelModal()" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-2 rounded-lg text-xs sm:text-sm shadow transition flex items-center justify-center">
                <i class="fa-solid fa-file-excel mr-1.5"></i> อัปโหลด Excel
              </button>
              <button onclick="printExamCards()" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded-lg text-xs sm:text-sm shadow transition flex items-center justify-center">
                <i class="fa-solid fa-print mr-1.5"></i> พิมพ์ชุดข้อสอบ
              </button>
            </div>
          </div>
        </div>
        <div id="questionList" class="space-y-3 sm:space-y-4"></div>
      </div>

    </div>
  </div>

  <!-- AREA สำหรับการพิมพ์กระดาษ A4 -->
  <div id="print-area" class="hidden"></div>

  <!-- Footer -->
  <footer class="mt-12 py-6 bg-slate-800 text-slate-300 text-center text-sm no-print">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <p class="font-medium">created & designed by Shakir</p>
      </div>
      <button onclick="openDonateModal()" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center shadow-lg">
        <i class="fa-solid fa-mug-hot mr-2 text-base"></i> สนับสนุนค่ากาแฟ ☕
      </button>
    </div>
  </footer>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx9KLEC8MF_c0pgYoIZrI84jWOO5l6NnCXnfs0MQ6fk-uGuL9T4iwmevmp6DzJ8qG4/exec";
    let currentUser = null;
    let currentSubjectId = null;
    let subjectsData = [];

    const REQUIRED_HEADERS = [
      'รูปแบบ', 'กลุ่มสาระ', 'ระดับชั้น', 'สาระ', 'มาตรฐาน',
      'ตัวชี้วัด', 'ระดับพฤติกรรม', 'วัตถุประสงค์', 'โจทย์',
      'ตัวเลือก1', 'ตัวเลือก2', 'ตัวเลือก3', 'ตัวเลือก4', 'เฉลย', 'เหตุผล', 'คำอธิบายข้อที่ผิด'
    ];

    window.onload = function() {
      const savedUser = localStorage.getItem('itemcard_user');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        showDashboard();
      }
    };

    function switchAuthTab(tab) {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const loginTabBtn = document.getElementById('loginTabBtn');
      const registerTabBtn = document.getElementById('registerTabBtn');

      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        loginTabBtn.className = "flex-1 py-3 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 transition";
        registerTabBtn.className = "flex-1 py-3 text-center font-bold text-slate-400 border-b-2 border-transparent hover:text-indigo-600 transition";
      } else {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        loginTabBtn.className = "flex-1 py-3 text-center font-bold text-slate-400 border-b-2 border-transparent hover:text-indigo-600 transition";
        registerTabBtn.className = "flex-1 py-3 text-center font-bold text-emerald-600 border-b-2 border-emerald-600 transition";
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('loginUsername').value.trim();
      const pass = document.getElementById('loginPassword').value.trim();

      Swal.fire({ title: 'กำลังตรวจสอบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'loginUser', username: user, password: pass })
        });
        const result = await res.json();
        if (result.status === 'success') {
          currentUser = { 
            username: result.username, 
            fullname: result.fullname || result.username 
          };
          localStorage.setItem('itemcard_user', JSON.stringify(currentUser));
          showDashboard();
          Swal.fire({ icon: 'success', title: 'เข้าสู่ระบบสำเร็จ', timer: 1200, showConfirmButton: false });
        } else {
          Swal.fire('ข้อผิดพลาด', result.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง', 'error');
        }
      } catch (err) {
        Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อระบบได้', 'error');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const fullname = document.getElementById('regFullname').value.trim();
      const user = document.getElementById('regUsername').value.trim();
      const pass = document.getElementById('regPassword').value.trim();

      if (!fullname || !user || !pass) {
        Swal.fire('ข้อผิดพลาด', 'กรุณากรอกข้อมูลให้ครบทุกช่อง', 'warning');
        return;
      }

      Swal.fire({ title: 'กำลังบันทึกการลงทะเบียน...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'registerUser', username: user, password: pass, fullname: fullname })
        });
        const result = await res.json();
        if (result.status === 'success') {
          Swal.fire({
            icon: 'success',
            title: 'ลงทะเบียนสำเร็จ!',
            text: 'ลงทะเบียนเรียบร้อยแล้ว สามารถเข้าสู่ระบบได้ทันที',
            confirmButtonText: 'ไปหน้าเข้าสู่ระบบ'
          }).then(() => {
            document.getElementById('loginUsername').value = user;
            switchAuthTab('login');
          });
        } else {
          Swal.fire('ข้อผิดพลาด', result.message, 'error');
        }
      } catch (err) {
        Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อระบบได้', 'error');
      }
    }

    function openDonateModal() {
      const phone = "0952200855";
      const qrUrl = `https://promptpay.io/${phone}.png`;
      Swal.fire({
        title: '<strong>สนับสนุนค่ากาแฟ ☕</strong>',
        html: `
          <div class="text-center">
            <p class="text-xs text-slate-600 mb-3">สแกน QR Code ผ่านแอปธนาคารเพื่อสนับสนุนผู้พัฒนา</p>
            <img src="${qrUrl}" alt="PromptPay QR Code" class="mx-auto w-48 h-48 border rounded-lg shadow-md mb-3">
            <p class="font-bold text-sm text-slate-800">พร้อมเพย์: <span class="text-indigo-600">${phone}</span></p>
            <p class="text-xs text-slate-500 mt-1">ชื่อบัญชี: เอกวิทย์ สมาน</p>
          </div>
        `,
        showCloseButton: true,
        showConfirmButton: false
      });
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('authTitle').innerText = isRegisterMode ? 'ลงทะเบียนใหม่' : 'เข้าสู่ระบบ';
      document.getElementById('toggleAuthBtn').innerText = isRegisterMode ? 'มีบัญชีอยู่แล้ว? เข้าสู่ระบบ' : 'ยังไม่มีบัญชี? ลงทะเบียนที่นี่';
    }

    async function handleAuth(e) {
      e.preventDefault();
      const user = document.getElementById('authUsername').value;
      const pass = document.getElementById('authPassword').value;
      Swal.fire({ title: 'กำลังตรวจสอบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      if (isRegisterMode) {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'registerUser', username: user, password: pass })
        });
        const result = await res.json();
        if (result.status === 'success') {
          Swal.fire('สำเร็จ', 'ลงทะเบียนเรียบร้อย เข้าสู่ระบบได้ทันที', 'success');
          toggleAuthMode();
        } else {
          Swal.fire('ข้อผิดพลาด', result.message, 'error');
        }
      } else {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'loginUser', username: user, password: pass })
        });
        const result = await res.json();
        if (result.status === 'success') {
          currentUser = { username: user };
          localStorage.setItem('itemcard_user', JSON.stringify(currentUser));
          showDashboard();
        } else {
          Swal.fire('ข้อผิดพลาด', result.message, 'error');
        }
      }
    }

    function logout() {
      localStorage.removeItem('itemcard_user');
      currentUser = null;
      document.getElementById('authSection').classList.remove('hidden');
      document.getElementById('dashboardSection').classList.add('hidden');
      document.getElementById('subjectDetailSection').classList.add('hidden');
      document.getElementById('userInfo').classList.add('hidden');
    }

    async function loadDataFromSheets() {
      Swal.fire({ title: 'กำลังโหลด...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getSubjects', username: currentUser.username })
        });
        const result = await res.json();
        if (result.status === 'success') {
          subjectsData = result.subjects;
          Swal.close();
        }
      } catch (err) {
        Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อได้', 'error');
      }
    }

    async function showDashboard() {
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('subjectDetailSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      document.getElementById('userInfo').classList.remove('hidden');
      document.getElementById('userName').innerText = currentUser.fullname || currentUser.username;
     
      await loadDataFromSheets();
      renderSubjects();
    }

    function renderSubjects() {
      const listContainer = document.getElementById('subjectList');
      listContainer.innerHTML = '';
      if (subjectsData.length === 0) {
        listContainer.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400">ยังไม่มีรายวิชาที่สร้างขึ้น กด "เพิ่มรายวิชาใหม่" เพื่อเริ่มสร้าง</div>`;
        return;
      }
      subjectsData.forEach((s) => {
        const qCount = s.questions ? s.questions.length : 0;
        listContainer.innerHTML += `
          <div class="bg-white rounded-2xl shadow-md p-5 relative flex flex-col justify-between hover:shadow-lg transition">
            <div>
              <span class="text-xs font-semibold px-2.5 py-1 rounded bg-indigo-100 text-indigo-800">${s.code}</span>
              <h3 class="text-lg font-bold text-slate-800 mt-2">${s.name}</h3>
              <p class="text-sm text-slate-500 mt-1">หัวข้อ: ${s.topic || '-'}</p>
              <p class="text-sm text-slate-500">เป้าหมาย: ${s.maxQuestions || 0} ข้อ (สร้างแล้ว ${qCount} ข้อ)</p>
            </div>
            <div class="mt-6 flex justify-between items-center border-t pt-4">
              <button onclick="openSubjectDetail('${s.id}')" class="text-indigo-600 font-semibold hover:underline text-sm flex items-center">
                <i class="fa-solid fa-folder-open mr-1.5"></i> จัดการข้อสอบ
              </button>
              <div class="space-x-1">
                <button onclick="editSubject('${s.id}')" class="text-amber-500 hover:text-amber-700 p-2"><i class="fa-solid fa-pen"></i></button>
                <button onclick="deleteSubject('${s.id}')" class="text-red-500 hover:text-red-700 p-2"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
          </div>
        `;
      });
    }

    async function openSubjectModal(subject = null) {
      const { value: formValues } = await Swal.fire({
        title: subject ? 'แก้ไขรายวิชา' : 'เพิ่มรายวิชาใหม่',
        html: `
          <div class="text-left space-y-3">
            <div>
              <label class="text-xs font-bold text-slate-600">รหัสวิชา</label>

        } else {

            <div class="w-full sm:flex-1 break-words">

                <span class="text-xs bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded font-medium border border-indigo-200">แบบ${q.type || 'เลือกตอบ'}</span>

              <p class="mt-2 text-slate-800 font-medium text-sm sm:text-base leading-relaxed break-words">${q.question || '-'}</p>
              <div class="text-xs text-slate-500 mt-2.5 space-y-1 bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                <p class="break-words"><strong>ตัวเลือก:</strong> ${choicesText}</p>
                <div class="flex flex-wrap gap-x-4 gap-y-1 pt-1 border-t border-slate-200/60 mt-1">
                  <span><strong>เฉลย:</strong> <span class="text-indigo-600 font-semibold">${q.answer || '-'}</span></span>

    function handleTypeChange(qData = {}) {
      const typeSelect = document.getElementById('q-type');
      if (!typeSelect) return;
      const type = typeSelect.value;
      const choicesBox = document.getElementById('choices-container');
     
      if (type === 'เลือกตอบ') {
        choicesBox.innerHTML = `
          <div><label class="font-bold text-slate-600">ตัวเลือก 1</label><input id="q-c1" class="swal2-input !mt-1 !h-9 text-xs !w-full" value="${qData.choice1 || ''}"></div>
          <div><label class="font-bold text-slate-600">ตัวเลือก 2</label><input id="q-c2" class="swal2-input !mt-1 !h-9 text-xs !w-full" value="${qData.choice2 || ''}"></div>
          <div><label class="font-bold text-slate-600">ตัวเลือก 3</label><input id="q-c3" class="swal2-input !mt-1 !h-9 text-xs !w-full" value="${qData.choice3 || ''}"></div>
          <div><label class="font-bold text-slate-600">ตัวเลือก 4</label><input id="q-c4" class="swal2-input !mt-1 !h-9 text-xs !w-full" value="${qData.choice4 || ''}"></div>
        `;
      } else if (type === 'ถูกผิด') {
        choicesBox.innerHTML = `
          <div class="col-span-full bg-slate-50 p-2.5 rounded border text-slate-600 font-medium text-xs">
            <strong>ตัวเลือกอัตโนมัติ:</strong> 1) ถูก &nbsp;&nbsp;&nbsp; 2) ผิด
          </div>
        `;
      } else {
        choicesBox.innerHTML = `
          <div class="col-span-full space-y-2">
            <div class="flex justify-between items-center mb-1">
              <span class="text-slate-500 italic text-[11px]">เพิ่มตัวเลือก/คำตอบย่อย (สูงสุด 4 ช่อง)</span>
              <button type="button" onclick="addDynamicOption()" id="btnAddOption" class="bg-indigo-600 hover:bg-indigo-700 text-white px-2.5 py-1 rounded text-xs transition">
                <i class="fa-solid fa-plus mr-1"></i> เพิ่มตัวเลือก
              </button>
            </div>
            <div id="dynamic-inputs-list" class="space-y-2"></div>
          </div>
        `;
        const existingChoices = [qData.choice1, qData.choice2, qData.choice3, qData.choice4].filter(c => c && c.trim() !== '');
        if (existingChoices.length > 0) {
          existingChoices.forEach(val => addDynamicOption(val));
        } else {
          addDynamicOption();
        }
      }
    }

    function addDynamicOption(value = '') {
      const container = document.getElementById('dynamic-inputs-list');
      if (!container) return;
      const currentInputs = container.querySelectorAll('.dynamic-opt-input');
      if (currentInputs.length >= 4) {
        Swal.showValidationMessage('สามารถเพิ่มตัวเลือกได้สูงสุด 4 ช่องเท่านั้น');
        return;
      }
      const optId = `q-dyn-${Date.now()}-${Math.floor(Math.random() * 1000)}`;
      const div = document.createElement('div');
      div.className = 'flex items-center space-x-2 dynamic-opt-item';
      div.innerHTML = `
        <span class="text-xs font-bold text-slate-500 w-14 shrink-0">ช่องที่ ${container.children.length + 1}:</span>
        <input id="${optId}" class="swal2-input !mt-0 !h-9 text-xs flex-1 dynamic-opt-input" placeholder="ระบุตัวเลือก/ข้อความ" value="${value}">
        <button type="button" onclick="removeDynamicOption(this)" class="text-red-500 hover:text-red-700 p-1.5 text-xs">
          <i class="fa-solid fa-trash"></i>
        </button>
      `;
      container.appendChild(div);
      updateDynamicOptionLabels();
    }

    function removeDynamicOption(btn) {
      const item = btn.closest('.dynamic-opt-item');
      if (item) {
        item.remove();
        updateDynamicOptionLabels();
      }
    }

    function updateDynamicOptionLabels() {
      const container = document.getElementById('dynamic-inputs-list');
      if (!container) return;
      const items = container.querySelectorAll('.dynamic-opt-item');
      items.forEach((item, index) => {
        const label = item.querySelector('span');
        if (label) label.innerText = `ช่องที่ ${index + 1}:`;
      });
      const btnAdd = document.getElementById('btnAddOption');
      if (btnAdd) {
        btnAdd.disabled = items.length >= 4;
        if (items.length >= 4) {
          btnAdd.classList.add('opacity-50', 'cursor-not-allowed');
        } else {
          btnAdd.classList.remove('opacity-50', 'cursor-not-allowed');
        }
      }
    }

          'เหตุผล': 'เซลล์พืชมีผนังเซลล์เป็นส่วนประกอบภายนอก',
          'คำอธิบายข้อที่ผิด': 'ไลโซโซมและเซนทริโอลพบในเซลล์สัตว์'
        }
      ];
      const ws = XLSX.utils.json_to_sheet(templateData, { header: REQUIRED_HEADERS });
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Template_Questions");
      XLSX.writeFile(wb, "แม่แบบข้อสอบ_ItemCard.xlsx");
    }

    // ฟังก์ชันเปิด Modal สำหรับอัปโหลด Excel
    async function openExcelModal() {
      const { value: file } = await Swal.fire({
        title: '<strong>นำเข้าข้อสอบผ่าน Excel</strong>',
        width: '90%',
        maxWidth: '500px',
        html: `
          <div class="text-left text-xs space-y-3 p-1">
            <div class="bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-lg flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
              <div>
                <p class="font-bold">ยังไม่มีไฟล์แม่แบบ?</p>
                <p class="text-[11px] text-amber-700">ดาวน์โหลดแม่แบบ Excel เพื่อกรอกข้อมูลให้ถูกต้องตามโครงสร้าง</p>
              </div>
              <button type="button" onclick="downloadExcelTemplate()" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded text-xs font-semibold shadow transition flex items-center whitespace-nowrap">
                <i class="fa-solid fa-download mr-1"></i> โหลดแม่แบบ
              </button>
            </div>
            <div class="mt-4">
              <label class="block font-bold text-slate-700 mb-1">เลือกไฟล์ Excel (.xlsx, .xls)</label>
              <input type="file" id="swalExcelFile" accept=".xlsx, .xls" class="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 border rounded-lg p-1">
            </div>
            <p class="text-[11px] text-slate-400 italic">* ระบบจะตรวจสอบชื่อหัวแถว (Header) หากไม่ตรงตามแม่แบบจะไม่สามารถนำเข้าข้อมูลได้</p>
          </div>
        `,
        showCancelButton: true,
        confirmButtonText: 'อัปโหลดและตรวจสอบ',
        cancelButtonText: 'ยกเลิก',
        focusConfirm: false,
        preConfirm: () => {
          const fileInput = document.getElementById('swalExcelFile');
          if (!fileInput || !fileInput.files[0]) {
            Swal.showValidationMessage('กรุณาเลือกไฟล์ Excel ก่อนทำรายการ');
            return false;
          }
          return fileInput.files[0];
        }
      });
      if (file) {
        processExcelFile(file);
      }
    }

    // ฟังก์ชันอ่านไฟล์ ตรวจสอบ Header และบันทึก
    function processExcelFile(file) {
      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const rawHeaders = XLSX.utils.sheet_to_json(worksheet, { header: 1 })[0] || [];
          const headers = rawHeaders.map(h => String(h).trim());
          const missingHeaders = REQUIRED_HEADERS.filter(h => !headers.includes(h));

          if (missingHeaders.length > 0) {
            Swal.fire({
              icon: 'error',
              title: 'รูปแบบไฟล์ไม่ถูกต้อง!',
              html: `
                <div class="text-left text-xs space-y-2">
                  <p class="text-red-600 font-bold">หัวแถว (Header) ในไฟล์ไม่ตรงกับแม่แบบที่กำหนด</p>
                  <p>คอลัมน์ที่ขาดหายไปหรือพิมพ์ผิด:</p>
                  <div class="bg-red-50 p-2 border border-red-200 rounded text-red-700 font-mono text-[11px]">
                    ${missingHeaders.join(', ')}
                  </div>
                  <p class="text-slate-500">กรุณาดาวน์โหลดไฟล์แม่แบบ (Template) แล้วกรอกข้อมูลใหม่อีกครั้ง</p>
                </div>
              `
            });
            return;
          }
          const rows = XLSX.utils.sheet_to_json(worksheet);
         
          if (rows.length === 0) {
            Swal.fire('แจ้งเตือน', 'ไม่พบข้อมูลข้อสอบในไฟล์ Excel', 'warning');
            return;
          }
          Swal.fire({
            title: 'กำลังนำเข้า...',
            text: `กำลังบันทึกข้อมูลทั้งหมด ${rows.length} ข้อ`,
            allowOutsideClick: false,
            didOpen: () => Swal.showLoading()
          });
          for (let i = 0; i < rows.length; i++) {
            const r = rows[i];
            const qObj = {
              id: 'q_' + Date.now() + '_' + i,
              number: i + 1,
              type: r['รูปแบบ'] || 'เลือกตอบ',
              group: r['กลุ่มสาระ'] || '',
              grade: r['ระดับชั้น'] || '',
              strand: r['สาระ'] || '',
              standard: r['มาตรฐาน'] || '',
              indicator: r['ตัวชี้วัด'] || '',
              behavior: r['ระดับพฤติกรรม'] || 'ความจำ',
              objective: r['วัตถุประสงค์'] || '',
              question: r['โจทย์'] || '',
              choice1: String(r['ตัวเลือก1'] || ''),
              choice2: String(r['ตัวเลือก2'] || ''),
              choice3: String(r['ตัวเลือก3'] || ''),
              choice4: String(r['ตัวเลือก4'] || ''),
              answer: String(r['เฉลย'] || ''),
              reason: String(r['เหตุผล'] || ''),
              wrongReason: String(r['คำอธิบายข้อที่ผิด'] || '')
            };
            await fetch(GAS_URL, {
              method: 'POST',
              body: JSON.stringify({ action: 'saveQuestion', username: currentUser.username, subjectId: currentSubjectId, question: qObj })
            });
          }
          await loadDataFromSheets();
          renderQuestions();
          Swal.fire('สำเร็จ', `นำเข้าข้อสอบจำนวน ${rows.length} ข้อ เรียบร้อยแล้ว`, 'success');
        } catch (err) {
          Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถอ่านไฟล์ Excel ได้: ' + err.message, 'error');
        }
      };
      reader.readAsArrayBuffer(file);
    }

    /* ฟังก์ชันพิมพ์ชุดข้อสอบ (กระดาษ A4 แนวตั้ง 1 หน้ามี 2 การ์ดข้อสอบ) */
    function printExamCards() {
      const subject = subjectsData.find(s => s.id === currentSubjectId);
      if (!subject || !subject.questions || subject.questions.length === 0) {
        Swal.fire('ไม่พบข้อสอบ', 'รายวิชานี้ยังไม่มีข้อสอบสำหรับพิมพ์', 'warning');
        return;
      }

      const printArea = document.getElementById('print-area');
      let cardsHTML = '';

      for (let i = 0; i < subject.questions.length; i += 2) {
        cardsHTML += '<div class="a4-page page-break">';
        cardsHTML += generateCardHTML(subject, subject.questions[i], i + 1);

        if (i + 1 < subject.questions.length) {
          cardsHTML += generateCardHTML(subject, subject.questions[i + 1], i + 2);
        }
        cardsHTML += '</div>';
      }

      printArea.innerHTML = cardsHTML;
      printArea.classList.remove('hidden');

      window.print();

      setTimeout(() => {
        printArea.classList.add('hidden');
      }, 500);
    }

    /* ฟังก์ชันสร้าง HTML สำหรับบัตรข้อสอบแต่ละใบ (ตามแบบรูปภาพอ้างอิง) */
    function generateCardHTML(subject, q, num) {
      const qType = q.type || 'เลือกตอบ';
     
      const isMc = (qType === 'เลือกตอบ');
      const isTf = (qType === 'ถูกผิด');
      const isMatch = (qType === 'จับคู่');
      const isFill = (qType === 'เติมคำ');
      const isSubjective = (qType === 'อัตนัย');

      const behaviors = ['ความจำ', 'ความเข้าใจ', 'นำไปใช้', 'วิเคราะห์', 'ประเมินค่า', 'สร้างสรรค์'];
      const bCheck = {};
      behaviors.forEach(b => {
        bCheck[b] = (q.behavior === b);
      });

      let choicesHTML = '';
      if (isMc) {
        choicesHTML = `
          <div class="grid grid-cols-2 gap-x-2 gap-y-1 mt-1 pl-2 text-xs">
            <div>1. ${q.choice1 || ''}</div>
            <div>2. ${q.choice2 || ''}</div>
            <div>3. ${q.choice3 || ''}</div>
            <div>4. ${q.choice4 || ''}</div>
          </div>
        `;
      } else if (isTf) {
        choicesHTML = `<div class="mt-1 pl-2 text-xs">1) ถูก &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 2) ผิด</div>`;
      } else {
        const opts = [q.choice1, q.choice2, q.choice3, q.choice4].filter(c => c && c.trim() !== '');
        if (opts.length > 0) {
          choicesHTML = `<div class="mt-1 pl-2 space-y-0.5 text-xs">` + opts.map((c, i) => `<div>${i + 1}) ${c}</div>`).join('') + `</div>`;
        } else {
          choicesHTML = `<div class="mt-1 pl-2 italic text-gray-500 text-xs">(- รูปแบบ${qType} -)</div>`;
        }
      }

      return `
        <div class="card-container">
          
          <!-- Header: ชื่อบัตรข้อสอบ + กล่องข้อขวาบน -->
          <div class="card-header-box">
            <div class="w-1/4"></div>
            <div class="w-2/4 text-center font-bold text-sm">บัตรข้อสอบ (Item Card)</div>
            <div class="w-1/4 flex justify-end">
              <div class="border border-black px-3 py-0.5 font-bold text-xs flex items-center gap-1.5 bg-white">
                <span>ข้อที่</span>
                <span class="text-sm font-bold">${num}</span>
              </div>
            </div>
          </div>

          <!-- Main Body Grid Layout (ตารางสองคอลัมน์ใหญ่) -->
          <div class="card-main-grid">
            
            <!-- ฝั่งซ้าย: ข้อมูลรายวิชา ตัวเลือก ลายเซ็น -->
            <div class="card-left-col">
              <div>
                <!-- ข้อ 1. รูปแบบข้อสอบ -->
                <div class="flex items-start gap-1 leading-tight">
                  <span class="font-bold whitespace-nowrap">1.รูปแบบข้อสอบ</span>
                  <div class="flex-1">
                    <span class="inline-block mr-2">1. <span class="radio-icon ${isMc ? 'checked' : ''}"></span> แบบเลือกตอบ (Multiple choices)</span>
                    <div class="flex flex-wrap gap-x-2 gap-y-0.5 mt-0.5">
                      <span>2. แบบอื่น ๆ</span>
                      <span><span class="radio-icon ${isTf ? 'checked' : ''}"></span> ถูกผิด</span>
                      <span><span class="radio-icon ${isMatch ? 'checked' : ''}"></span> จับคู่</span>
                      <span><span class="radio-icon ${isFill ? 'checked' : ''}"></span> เติมคำ</span>
                      <span><span class="radio-icon ${isSubjective ? 'checked' : ''}"></span> อัตนัย</span>
                    </div>
                  </div>
                </div>

                <!-- ข้อ 2-6. ข้อมูลวิชา -->
                <div class="grid grid-cols-12 gap-x-2 gap-y-0.5 mt-1.5 leading-tight">
                  <div class="col-span-4"><span class="font-bold">2.รายวิชา</span> ${subject.name || ''}</div>
                  <div class="col-span-3"><span class="font-bold">รหัส</span> ${subject.code || ''}</div>
                  <div class="col-span-5"><span class="font-bold">กลุ่มสาระการเรียนรู้</span> ${q.group || ''}</div>
                  
                  <div class="col-span-12"><span class="font-bold">3.ระดับชั้น</span> ${q.grade || ''}</div>
                  <div class="col-span-12"><span class="font-bold">4.สาระที่</span> ${q.strand || ''}</div>
                  <div class="col-span-12"><span class="font-bold">5.มาตรฐานการเรียนรู้ที่</span> ${q.standard || ''}</div>
                  <div class="col-span-12"><span class="font-bold">6.ตัวชี้วัดที่</span> ${q.indicator || ''}</div>
                </div>

                <!-- ข้อ 7. ระดับพฤติกรรม -->
                <div class="mt-1.5">
                  <span class="font-bold">7.ระดับพฤติกรรมที่ต้องการวัด</span>
                  <div class="grid grid-cols-3 gap-y-0.5 pl-4 mt-0.5 leading-tight">
                    <div><span class="radio-icon ${bCheck['ความจำ'] ? 'checked' : ''}"></span> ความจำ</div>
                    <div><span class="radio-icon ${bCheck['ความเข้าใจ'] ? 'checked' : ''}"></span> ความเข้าใจ</div>
                    <div><span class="radio-icon ${bCheck['นำไปใช้'] ? 'checked' : ''}"></span> นำไปใช้</div>
                    <div><span class="radio-icon ${bCheck['วิเคราะห์'] ? 'checked' : ''}"></span> วิเคราะห์</div>
                    <div><span class="radio-icon ${bCheck['ประเมินค่า'] ? 'checked' : ''}"></span> ประเมินค่า</div>
                    <div><span class="radio-icon ${bCheck['สร้างสรรค์'] ? 'checked' : ''}"></span> สร้างสรรค์</div>
                  </div>
                </div>

                <!-- ข้อ 8. วัตถุประสงค์ -->
                <div class="mt-1.5">
                  <span class="font-bold">8.วัตถุประสงค์เชิงพฤติกรรมของข้อสอบนี้</span>
                  <div class="pl-2 mt-0.5">${q.objective || ''}</div>
                </div>

                <!-- ข้อ 9. โจทย์ -->
                <div class="mt-2">
                  <span class="font-bold">9.โจทย์/คำถาม</span>
                  <div class="pl-2 mt-0.5 font-medium leading-relaxed">${q.question || ''}</div>
                </div>

                <!-- ข้อ 10. ตัวเลือก -->
                <div class="mt-2">
                  <span class="font-bold">10.ตัวเลือก</span>
                  ${choicesHTML}
                </div>
              </div>

              <!-- ลายเซ็นท้ายการ์ด (ตรงตามรูปภาพอ้างอิง) -->
              <div class="mt-4 pt-2">
                <!-- ผู้กลั่นกรองข้อสอบ บรรทัดบน (ฝั่งขวา) -->
                <div class="flex justify-end mb-2">
                  <div class="w-1/2 text-center">
                    <div>( &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; )</div>
                    <div class="font-bold mt-0.5">ผู้กลั่นกรองข้อสอบ</div>
                  </div>
                </div>

                <!-- บรรทัดล่าง: ผู้ออกข้อสอบ (ซ้าย) & ผู้กลั่นกรองข้อสอบ (ขวา) -->
                <div class="flex justify-between items-end">
                  <div class="w-1/2 text-center">
                    <div class="text-left pl-2 mb-0.5"><span class="font-bold">ลงชื่อ</span></div>
                    <div>( ${currentUser ? (currentUser.fullname || currentUser.username) : '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;'} )</div>
                    <div class="font-bold mt-0.5">ผู้ออกข้อสอบ</div>
                  </div>

                  <div class="w-1/2 text-center">
                    <div>( &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; )</div>
                    <div class="font-bold mt-0.5">ผู้กลั่นกรองข้อสอบ</div>
                  </div>
                </div>
              </div>

            </div>

            <!-- ฝั่งขวา: เฉลย + เหตุผล + คำอธิบายข้อที่ผิด (ต่อกันช่วงกลาง) -->
            <div class="card-right-col">
              <div class="text-center font-bold text-sm mb-3">เฉลย</div>
              
              <div class="font-bold mb-0.5">ตัวเลือกที่ถูกคือ</div>
              <div class="pl-2 mb-2 font-semibold text-gray-900">${q.answer || ''}</div>
              
              <div class="font-bold mb-0.5">เหตุผล</div>
              <div class="pl-2 mb-5 text-xs leading-relaxed text-gray-800 min-h-[30px]">
                ${q.reason || ''}
              </div>

              <!-- คำอธิบายข้อที่ผิด ย้ายขึ้นมาต่อจากเหตุผลตรงกลางคอลัมน์ -->
              <div class="font-bold mb-0.5">คำอธิบายข้อที่ผิด</div>
              <div class="pl-2 text-xs leading-relaxed text-gray-800">
                ${q.wrongReason || ''}
              </div>
            </div>

          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
